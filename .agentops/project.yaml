# Interop metadata for PromptGraph
# Part of the HERMES OSS `.agentops/` shared format.
# Tools MUST ignore fields they don't understand.

project:
  name: PromptGraph
  slug: promptgraph
  ecosystem: HERMES OSS
  # A tool is enabled when its package is importable. Do not hardcode.
  optional_integrations:
    agentgear: auto
    agentbench: auto
    projectkaizen: auto
    skillguard: auto

capability:
  # What this tool is allowed to do in the ecosystem.
  reads:
    - .agentops/decisions/**
    - .agentops/context/**
    - .agentops/promptgraph/**
    - .agentops/metrics/**   # read-only, only for integration
  writes:
    - .agentops/context/**
    - .agentops/decisions/**
    - .agentops/promptgraph/**
  network: false
  package_install: false
  git_write: false

policies:
  # context preparation only — PromptGraph DOES NOT route, validate, or improve.
  responsibility: context